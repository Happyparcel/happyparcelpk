<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HappyParcel.pk | Customized Gifts</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#fafafa;
color:#222;
}

header{
background:white;
padding:20px 8%;
display:flex;
justify-content:space-between;
align-items:center;
box-shadow:0 3px 15px rgba(0,0,0,.08);
position:sticky;
top:0;
z-index:999;
}

.logo{
font-size:30px;
font-weight:700;
color:#d62828;
}

nav a{
text-decoration:none;
margin-left:25px;
color:#333;
font-weight:500;
transition:.3s;
}

nav a:hover{
color:#d62828;
}

.hero{

height:90vh;

display:flex;

justify-content:center;

align-items:center;

text-align:center;

padding:20px;

background:
linear-gradient(rgba(255,255,255,.55), rgba(255,255,255,.55)),
url("images/hero.jpg");

background-size:cover;

background-position:center;

background-repeat:no-repeat;

}

@media(max-width:768px){

.hero h1{

font-size:35px;

}

.hero p{

font-size:16px;

}

}
.btn{

display:inline-block;

padding:15px 40px;

background:#d62828;

color:white;

text-decoration:none;

border-radius:50px;

font-weight:600;

transition:.3s;

}

.btn:hover{

background:#b91c1c;

transform:translateY(-3px);

}

</style>

</head>

<body>

<header>

<div class="logo">

HappyParcel.pk

</div>

<nav>

<a href="#">Home</a>

<a href="#">Shop</a>

<a href="#">Categories</a>

<a href="#">About</a>

<a href="#">Contact</a>

</nav>

</header>

<section class="hero">

<div>

<h1>Make Every Moment Special 🎁</h1>
  

<p>
  
Beautiful Customized Gifts Delivered With Love
  
</p>


  
<a href="#" class="btn">
Explore Gifts 🎁
</a>

</div>

</section>

</body>
</html>
